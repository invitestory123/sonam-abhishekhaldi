    <!-- Background Music Player Styling -->
    <style>
      .wedding-music-btn {
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(27, 54, 42, 0.92);
        border: 1.5px solid rgba(197, 168, 128, 0.85);
        color: #C5A880;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), 0 0 12px rgba(197, 168, 128, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 9999;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        outline: none;
        padding: 0;
      }
      .wedding-music-btn:hover {
        transform: scale(1.1);
        background: #1B362A;
        border-color: #D4AF37;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4), 0 0 16px rgba(212, 175, 55, 0.4);
      }
      .wedding-music-btn.playing .icon-music {
        animation: musicSpin 6s linear infinite;
      }
      .wedding-music-btn.paused {
        opacity: 0.75;
        border-color: rgba(197, 168, 128, 0.4);
      }
      .wedding-music-btn.paused .icon-music {
        animation: none;
        opacity: 0.6;
      }
      .wedding-music-btn.paused::after {
        content: "";
        position: absolute;
        width: 24px;
        height: 2px;
        background: #C5A880;
        transform: rotate(-45deg);
        border-radius: 2px;
      }
      @keyframes musicSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @media (max-width: 640px) {
        .wedding-music-btn {
          bottom: 20px;
          right: 20px;
          width: 44px;
          height: 44px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Background Audio Element -->
    <audio id="weddingBgAudio" loop preload="auto">
      <source src="editable/assets/bg.mp3" type="audio/mpeg">
      <source src="editable/assets/bgsa.mp3" type="audio/mpeg">
      <source src="bg.mp3" type="audio/mpeg">
    </audio>

    <!-- Floating Background Music Toggle Button -->
    <button id="weddingMusicToggle" class="wedding-music-btn playing" aria-label="Toggle background music" title="Toggle Music">
      <svg class="icon-music" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
      </svg>
    </button>

    <div id="root"></div>

    <!-- Background Music Controller Script -->
    <script>
      (function() {
        var audio = document.getElementById('weddingBgAudio');
        var btn = document.getElementById('weddingMusicToggle');
        if (!audio || !btn) return;

        // Sync audio source from WEDDING_DATA if configured
        if (window.WEDDING_DATA && window.WEDDING_DATA.music && window.WEDDING_DATA.music.src) {
          var customSrc = window.WEDDING_DATA.music.src;
          if (audio.getAttribute('data-applied') !== customSrc) {
            audio.src = customSrc;
            audio.setAttribute('data-applied', customSrc);
          }
        }

        var isPlaying = false;

        function updateUI(playing) {
          isPlaying = playing;
          if (playing) {
            btn.classList.add('playing');
            btn.classList.remove('paused');
          } else {
            btn.classList.remove('playing');
            btn.classList.add('paused');
          }
        }

        function startAudio() {
          if (isPlaying) return;
          var promise = audio.play();
          if (promise !== undefined) {
            promise.then(function() {
              updateUI(true);
            }).catch(function() {
              updateUI(false);
            });
          }
        }

        // Try autoplay on page load
        startAudio();

        // Autoplay policy unlock on first user gesture
        var unlockEvents = ['click', 'touchstart', 'touchend', 'scroll', 'keydown'];
        function onFirstInteraction() {
          if (!isPlaying) {
            startAudio();
          }
          unlockEvents.forEach(function(evt) {
            window.removeEventListener(evt, onFirstInteraction, true);
          });
        }
        unlockEvents.forEach(function(evt) {
          window.addEventListener(evt, onFirstInteraction, { capture: true, passive: true });
        });

        // Toggle button click handler
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (audio.paused) {
            audio.play().then(function() {
              updateUI(true);
            }).catch(function() {
              updateUI(false);
            });
          } else {
            audio.pause();
            updateUI(false);
          }
        });
      })();
    </script>
  </body>
